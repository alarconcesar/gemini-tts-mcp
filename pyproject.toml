[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-tts-mcp"
version = "0.3.0"
description = "Multi-key Gemini TTS MCP server with API key rotation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "google-genai",
]

[project.scripts]
gemini-tts-mcp = "gemini_tts_mcp.server:main"
